find_free_space_action_server:
  ros__parameters:
    topic_name_global_costmap: '/global_costmap/costmap_raw'
    topic_name_footprint: '/global_costmap/published_footprint'

    search_radius_min: 3.0
    search_radius_max: 3.3      # 长度方向只有0.3m
    outside_min: 0.2
    outside_max: 0.35            # 宽度方向只有0.15m
    search_radius_extra_dis: 2.0 # 前避车时额外增加的寻找距离
    search_point_interval: 0.15  # 搜索带里沿路和横向的布点间隔，米

    external_point_max_distance: 8.0  # 外部停靠点距机器人的最大直线距离（米）
    check_service_max_time: 1.0
    show_global_costmap_raw_cv2: false
    show_global_costmap_raw_colored_cv2: false
    max_robot_pose_age: 1.0          # 机器人位姿超过 1 秒没更新的位姿，不当成有效位姿
    robot_pose_wait_timeout: 1.5     # 等待新鲜位姿超时
    footprint_sweep_long_step: 999.0   # 大于车身长边时不检查从机器人到目标的扫掠
    footprint_sweep_short_step: 999.0
